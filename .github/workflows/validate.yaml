name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Lint
        run: ruff check custom_components tests

      - name: Validate JSON catalogs and manifest
        run: python -m compileall -q custom_components && python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"

      - name: Validate Lovelace JavaScript syntax
        run: node --check custom_components/ha_health_monitor/www/ha-health-monitor-card.js

      - name: Run tests
        run: pytest -q
