scan_now:
  name: Scan now
  description: Run an immediate HA Health Monitor scan.

reset_freshness_learning:
  name: Reset freshness learning
  description: Reset the learned update cadence for one selected entity or all selected entities.
  fields:
    entity_id:
      name: Entity
      description: Leave empty to reset all selected freshness profiles.
      selector:
        entity:
          multiple: false

set_entity_excluded:
  name: Set entity monitoring exclusion
  description: Include or exclude one entity from HA Health Monitor.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          multiple: false
    excluded:
      name: Excluded
      description: Set true to omit the entity from monitoring, or false to include it again.
      required: true
      selector:
        boolean:

set_availability_profile:
  name: Configure device availability profile
  description: Configure conditional availability for a device.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
    reference_entity:
      name: Reference entity
      selector:
        entity:
          multiple: false
    conditional_entities:
      name: Conditional entities
      selector:
        entity:
          multiple: true
    inactive_states:
      name: Inactive states
      description: Exact inactive states, for example off or idle.
      selector:
        text:
    remove:
      name: Remove profile
      selector:
        boolean:


set_integration_availability_profile:
  name: Configure integration activity profile
  description: Pause entity monitoring for one integration config entry while its reference entity reports an explicit inactive state.
  fields:
    config_entry_id:
      name: Integration config entry
      required: true
      selector:
        config_entry:
    reference_entity:
      name: Activity reference entity
      required: false
      selector:
        entity:
          multiple: false
    inactive_states:
      name: Inactive states
      description: Comma-separated exact states, such as off, idle or standby.
      required: false
      selector:
        text:
    remove:
      name: Remove profile
      selector:
        boolean:
