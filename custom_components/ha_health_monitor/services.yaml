scan_now:
  name: Scan now
  description: Run an immediate HA Health Monitor scan.

reset_freshness_learning:
  name: Reset freshness learning
  description: Reset the learned update cadence for one selected entity or all selected entities.
  fields:
    entity_id:
      name: Entity
      description: Leave empty to reset all selected freshness profiles.
      selector:
        entity:
          multiple: false

set_entity_excluded:
  name: Set entity monitoring exclusion
  description: Include or exclude one entity from HA Health Monitor.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          multiple: false
    excluded:
      name: Excluded
      description: Set true to omit the entity from monitoring, or false to include it again.
      required: true
      selector:
        boolean:
